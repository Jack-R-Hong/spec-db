[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bincode = { version = "=2.0.1", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
deep_causality = "=0.13.4"
fjall = "3.0"
git2 = "0.20.4"
pulldown-cmark = "0.13"
rmcp = { version = "=0.16.0", features = ["server", "macros", "transport-io"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
tantivy = "0.25.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ultragraph = "0.8"
