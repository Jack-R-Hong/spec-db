[package]
name = "spec-db-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server for spec-db"

[dependencies]
spec-db-core = { workspace = true }
spec-db-causal = { workspace = true }
spec-db-search = { workspace = true }
spec-db-ingest = { workspace = true }
spec-db-router = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
