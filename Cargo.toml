[package]
name = "spec-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A causal specification database for AI agents"

[workspace]
members = [
    "crates/spec-db-core",
    "crates/spec-db-causal",
    "crates/search",
    "crates/ingest",
    "crates/router",
    "crates/mcp",
]

[workspace.dependencies]
deep_causality = "=0.13.4"
fjall = "3.0"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
clap = { version = "4.5", features = ["derive"] }
git2 = "0.20.4"
pulldown-cmark = "0.13"
tantivy = "0.25.0"
rmcp = "=0.16.0"
schemars = "0.8"
axum = "0.8"
bincode = { version = "=2.0.1", features = ["serde"] }
spec-db-core = { path = "crates/spec-db-core" }
spec-db-causal = { path = "crates/spec-db-causal" }
spec-db-search = { path = "crates/search" }
spec-db-ingest = { path = "crates/ingest" }
spec-db-router = { path = "crates/router" }
spec-db-mcp = { path = "crates/mcp" }

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_yml = { workspace = true }
rmcp = { workspace = true }
spec-db-core = { workspace = true }
spec-db-causal = { workspace = true }
spec-db-search = { workspace = true }
spec-db-ingest = { workspace = true }
spec-db-router = { workspace = true }
spec-db-mcp = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
